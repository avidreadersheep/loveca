name: loveca_ui
description: ラブカ シミュレーターの UI 層（Flutter / Windows デスクトップ）。
publish_to: 'none'
  # ★★ 1.0.0 なのは「製品として 1.0 に達したから」ではない ★★
  #   配信物の minAppVersion は loveca-data/loveca_data/build_dist.py:84 の
  #   関数既定値 "1.0.0" で固定されており、CLI に露出していない。
  #   したがって**これまでに作られた dist はすべて「アプリ 1.0.0 以上」を要求**し、
  #   それ未満だと planUpdate が appTooOld を返して 1 件も取り込めない。
  #   ★これは「データに合わせてアプリ版を変える」という本来逆の回避である。
  #     正す先は loveca-data 側で、ルール整合性チェック_v1.06.md D-7 に
  #     未決として登録してある（判断は Phase 4）。
  #   ★AppInfo.version と揃えること（test/app_info_test.dart が守る）。
version: 1.0.0

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # ドメイン層と DB 層。どちらも Flutter 非依存のまま使う（CLAUDE.md §1 / §2）。
  loveca_core:
    path: ../loveca-core
  loveca_db:
    path: ../loveca-db

  # ★spike が QueryExecutor を自前で組み立てるために要る。
  #   loveca_db の native.dart は UI isolate 実行の openFileExecutor しか出していないので、
  #   別 isolate 版（NativeDatabase.createInBackground）は呼び出し側で作る。
  #   loveca_db は変更しない。
  drift: ^2.34.3

  path: ^1.9.0

  # ★DB と設定ファイルの置き場を解決する（決定 D59）。
  #   loveca_db は置き場所を決めない（native.dart「置き場所は呼び出し側が決める。
  #   path_provider は Flutter 依存なのでこのパッケージからは参照しない」）ので、
  #   決めるのは loveca-ui の責務。
  #   ★loveca_core / loveca_db には持ち込まない。package:flutter を引き込むため、
  #     CLAUDE.md §1 / §2 の検証コマンドが既にこれを検知する。
  #   ★sqlite3_flutter_libs を却下した理由（D45 / SQLite の二重調達）は当てはまらない。
  #     path_provider は何も二重調達せず、OS のディレクトリを問い合わせるだけ。
  path_provider: ^2.1.5

  # ★spike の計測でだけ使う。索引の形を変えた場合の大きさと速さを
  #   メモリ上の DB で比べるために、drift を通さず素の sqlite3 を触る。
  sqlite3: ^3.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
