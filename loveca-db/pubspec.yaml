name: loveca_db
description: ラブカ シミュレーターのローカル DB 層（drift / SQLite）。Flutter 非依存。
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  # ★Flutter 非依存のものだけを入れる★
  # drift_flutter / sqlite3_flutter_libs / path_provider は Flutter 依存なので採らない。
  # DB ファイルの場所とネイティブライブラリの解決は呼び出し側の責務にする。
  drift: ^2.34.3
  sqlite3: ^3.5.2
  # ★★ 2026-09-02: ★3 件目の依存（★決定 D149 / ★代償として記録する / D115-2 の作法）★★
  #   ★**何に使うか**: ★配信物のマニフェストの相対 path を★★根の下に安全に繋ぐ★★
  #     （`src/native/local_dir_image_sink.dart` の 段 2 —— ★`normalize` / `isWithin`）。
  #   ★**手で書ける。★書かない理由**: ★★Windows の区切りと★ドライブ文字と★正規化を
  #     自前で書くと、★柵そのものが★★プラットフォームごとに割れる★★。
  #   ★**Flutter に依存しない**（★純粋 Dart / ★上の 3 行の禁止に当たらない。★確かめた）。
  #   ★**先例は `loveca-server`**（★同じ理由で `path` を採った / `docs/同期設計メモ.md` §60）。
  path: ^1.9.0
  loveca_core:
    path: ../loveca-core

dev_dependencies:
  drift_dev: ^2.34.5
  build_runner: ^2.16.0
  test: ^1.31.2
  lints: ^6.1.0
