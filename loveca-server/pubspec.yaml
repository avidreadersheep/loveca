name: loveca_server
description: ラブカ シミュレーターの同期サーバー（純粋 Dart / Flutter 非依存）。デッキを預かる保管庫であり、判断しない。
version: 0.1.0
publish_to: none

environment:
  # ★`loveca_db` に揃えた（`loveca-core` は ^3.4.0）。★どこに合わせるかは
  #   どの決定にも書かれていない（`docs/同期設計メモ.md` §38-13 の 4）。
  #   ★Phase 6 で `loveca_core` を path で足す人が合わせ直すことになる。
  sdk: ^3.11.0

# ★★★ 依存を足す前に `lib/loveca_server.dart` の「境界の宣言」を読むこと ★★★
#
# ★★ このパッケージは今日 1 つも依存を持たない（決定 D126-3）★★
#
# とくに `loveca_core` を **ここに書いてはならない。**
# 決定 **D115-6** は「サーバーが `loveca_core` の何を呼んでよいか」を
# **空で始まる許可リスト**で引くと定めている（禁止ではない）。
# → ★依存をここに書けば「呼べる」状態になり、**リストが空であることを
#   構造で守れなくなる。**
# → ★書かないでおけば、1 件目を足す人が **この行も一緒に触る**ことになり、
#   そこに必ず理由が付く（D115-6 の「空で始めれば、最初の 1 件に必ず理由が付く」）。
#
# ★許可リストの正は `lib/src/boundary.dart`。
#   ★見張りは `test/core_boundary_test.dart`（決定 **D115-7** の (c) ＝ 走査テスト）。

dev_dependencies:
  test: ^1.31.2
  lints: ^6.1.0
